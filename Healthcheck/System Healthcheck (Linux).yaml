- defaultTab: nodes
  description: 'Run an health check on a Linux host - CPU, Memory and disk space.'
  executionEnabled: true
  group: Healthcheck
  id: 532f0968-75f7-444f-bf1c-3891a799e730
  loglevel: INFO
  multipleExecutions: true
  name: System Healthcheck (Linux)
  nodeFilterEditable: false
  nodefilters:
    dispatch:
      excludePrecedence: true
      keepgoing: true
      rankOrder: ascending
      successOnEmptyNodeFilter: false
      threadcount: '5'
    filter: 'osFamily: unix'
    filterExclude: ' rundeckpro-rundeckpro-.*'
  nodesSelectedByDefault: true
  options:
  - name: pd_incident_id
  plugins:
    ExecutionLifecycle:
      Send Incident Output to Pagerduty: {}
      roi-metrics:
        userRoiData: '[{"key":"hours","label":"Hours","value":"2","desc":"Field key
          hours"}]'
  runnerSelector:
    filter: BDIAS
    runnerFilterMode: TAGS
    runnerFilterType: TAG_FILTER_AND
  schedule:
    dayofmonth:
      day: '*'
    month: '*'
    time:
      hour: 9-18
      minute: '0'
      seconds: '0'
    year: '*'
  scheduleEnabled: true
  schedules: []
  sequence:
    commands:
    - description: Disk Space
      plugins:
        LogFilter:
        - config:
            captureMultipleKeysValues: 'false'
            hideOutput: 'false'
            logData: 'false'
            name: disk-result
            regex: (.*)
          type: key-value-data-multilines
      script: |
        #!/bin/bash

        echo "1. Check disk space"
        disk_output=$(df -H / | grep -v Filesystem | awk '{print $5 " " $6}')
        used_pct=$(echo $disk_output | awk '{print $1}' | sed 's/%//')
        echo "Filesystem      Size  Used Avail Use% Mounted on"
        df -H / | grep -v Filesystem
        if [ "$used_pct" -ge 90 ]; then
          echo "🔴 Fault detected: Disk usage critical on ${disk_output}"
        else
          echo "🟢 No fault detected: Disk usage within normal parameters (${disk_output})"
        fi
        echo ""
    - description: Top 5 processes by CPU utilization
      plugins:
        LogFilter:
        - config:
            captureMultipleKeysValues: 'false'
            hideOutput: 'false'
            logData: 'false'
            name: cpu-result
            regex: (.*)
          type: key-value-data-multilines
      script: |
        #!/bin/bash

        echo "2. Top 5 processes by CPU utilization"
        cpu_output=$(ps -eo pid,comm,%cpu --sort=-%cpu | head -n 6)
        echo "$cpu_output"

        top_cpu=$(echo "$cpu_output" | awk 'NR==2 {print $3}')
        if (( $(echo "$top_cpu > 80" | bc -l) )); then
          echo "🔴 Fault detected: High CPU usage detected (${top_cpu}%)"
        else
          echo "🟢 No fault detected: CPU usage within normal parameters"
        fi
        echo ""
    - description: Top 5 Processes by Memory Usage
      plugins:
        LogFilter:
        - config:
            captureMultipleKeysValues: 'false'
            hideOutput: 'false'
            logData: 'false'
            name: memory-result
            regex: (.*)
          type: key-value-data-multilines
      script: |
        #!/bin/bash

        echo "3. Top 5 Processes by Memory Usage"
        mem_output=$(ps -eo pid,comm,%mem --sort=-%mem | head -n 6)
        echo "$mem_output"

        top_mem=$(echo "$mem_output" | awk 'NR==2 {print $3}')
        if (( $(echo "$top_mem > 80" | bc -l) )); then
          echo "🔴 Fault detected: High memory usage detected (${top_mem}%)"
        else
          echo "🟢 No fault detected: Memory usage within normal parameters"
        fi
        echo ""
    - description: Network usage
      plugins:
        LogFilter:
        - config:
            captureMultipleKeysValues: 'false'
            hideOutput: 'false'
            logData: 'false'
            name: network-result
            regex: (.*)
          type: key-value-data-multilines
      script: |
        #!/bin/bash

        echo "4. Network usage"
        ifstat -t 1 5
        echo "🟢 Network statistics captured"
        echo ""
    - description: System load
      plugins:
        LogFilter:
        - config:
            captureMultipleKeysValues: 'false'
            hideOutput: 'false'
            logData: 'false'
            name: load-result
            regex: (.*)
          type: key-value-data-multilines
      script: |
        #!/bin/bash

        echo "5. System load"
        uptime_output=$(uptime)
        echo "$uptime_output"

        load_avg=$(echo "$uptime_output" | awk -F'load average:' '{print $2}' | awk '{print $1}' | sed 's/,//')
        cpu_count=$(nproc)
        load_threshold=$(echo "$cpu_count * 0.8" | bc)

        if (( $(echo "$load_avg > $load_threshold" | bc -l) )); then
          echo "🔴 Fault detected: High system load (${load_avg} on ${cpu_count} CPUs)"
        else
          echo "🟢 No fault detected: System load within normal parameters (${load_avg} on ${cpu_count} CPUs)"
        fi
        echo ""
    - conditionGroups:
      - - key: ${option.pd_incident_id}
          operator: matches
          value: ^.+$
      description: Update PD Incident
      nodeStep: false
      subSteps:
      - configuration:
          incident_id: ${option.pd_incident_id}
          note: |-
            Disk space check:
            ${data.disk-result*}

            CPU Utilization check:
            ${data.cpu-result*}

            Memory Usage check:
            ${data.memory-result*}

            Network Utilization check:
            ${data.network-result*}

            System Load check:
            ${data.load-result*}
        nodeStep: false
        type: pd-note-step
      type: conditional
    keepgoing: true
    pluginConfig:
      LogFilter:
      - config:
          filterName: System healthcheck logs
          logOutputSettings: All
          regexPattern: (.*)
          stepStatus: Any
        type: pagerduty-incident-output-capture
      WorkflowStrategy:
        sequential:
          info: |-
            <table>
                <tr><td>1.</td><td class="text-info">NodeA</td> <td>step 1</td></tr>
                <tr><td>2.</td><td class="text-info">"</td> <td>step 2</td></tr>
                <tr><td>3.</td><td class="text-info">"</td> <td>step 3</td></tr>
                <tr><td>4.</td><td class="text-muted">NodeB</td> <td>step 1</td></tr>
                <tr><td>5.</td><td class="text-muted">"</td> <td>step 2</td></tr>
                <tr><td>6.</td><td class="text-muted">"</td> <td>step 3</td></tr>
            </table>
    strategy: sequential
  tags: roi
  timeout: 5m
  user: admin
  uuid: 532f0968-75f7-444f-bf1c-3891a799e730

